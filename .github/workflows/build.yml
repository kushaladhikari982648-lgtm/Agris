name: Build & Verify Agris (Fabric 1.20.1)

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to publish (e.g. v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (MC 1.20.1 toolchain) & Java 21 (Gradle 9 daemon)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Run static mixin & hygiene checks (Fabric 1.20.1)
        run: python3 tools/mixincheck.py 1.20.1 --quiet

      - name: Build Common & Fabric 1.20.1 remapped jars + JUnit 5
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :common:build :fabric:build :common:test 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -lh fabric/build/libs/

      - name: Surface failure details as check annotations
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            errs=$(awk '/^\* What went wrong:/{f=1} f{print} /^\* Try:/{if(f)exit}' \
              "$RUNNER_TEMP/build.log" 2>/dev/null | head -70 |
              sed -e 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}' || true)
            if [ -n "$errs" ]; then
              printf '::error::gradle failure:%s\n' "$errs"
            fi
            awk '/: (error|warning):/{c=6} c>0{print; c--}' "$RUNNER_TEMP/build.log" 2>/dev/null |
              grep -v -E "(unknown enum constant EnvType|Cannot find annotation method .*Environment)" |
              sed -e 's/%/%25/g' | head -80 | tr -d '\r' > "$RUNNER_TEMP/errors.txt" || true
            if [ -s "$RUNNER_TEMP/errors.txt" ]; then
              body=$(sed -e 's/$/%0A/' "$RUNNER_TEMP/errors.txt" | tr -d '\n')
              printf '::error::compiler diagnostics:%s\n' "$body"
            fi
            tail_body=$(tail -n 45 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            printf '::error::log tail:%s\n' "$tail_body"
          fi

      - name: Upload built Fabric 1.20.1 mod jar
        uses: actions/upload-artifact@v4
        with:
          name: agris-fabric-1.20.1-jar
          path: |
            fabric/build/libs/*.jar
            !**/build/libs/*-dev.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MOD_VER=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')
          MC_VER=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '[:space:]')
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v${MOD_VER}"
          fi

          mkdir -p release-dist
          cp "fabric/build/libs/agris-fabric-${MOD_VER}+mc${MC_VER}.jar" release-dist/
          if [ -f "fabric/build/libs/agris-fabric-${MOD_VER}+mc${MC_VER}-sources.jar" ]; then
            cp "fabric/build/libs/agris-fabric-${MOD_VER}+mc${MC_VER}-sources.jar" release-dist/
          fi
          cp shaderpacks/Agris-Pocket-Ultra-Mobile.zip release-dist/

          # Verify the remapped production Fabric jar contains fabric.mod.json and Intermediary-remapped bytecode
          unzip -l "release-dist/agris-fabric-${MOD_VER}+mc${MC_VER}.jar" | grep -q "fabric.mod.json"
          javap -cp "release-dist/agris-fabric-${MOD_VER}+mc${MC_VER}.jar" -v com.agris.mixin.core.LevelRendererMixin | grep -q -E "net/minecraft/class_[0-9]+"

          (cd release-dist && sha256sum * > SHA256SUMS.txt)
          ls -lh release-dist/

          cat > release-notes.md <<'NOTES'
          ## Agris v1.0.0 — Mobile-Optimized Shader Engine for Fabric 1.20.1 & Aetherium

          **Agris `v1.0.0`** brings full Iris/OptiFine OpenGL shader pack support and a dedicated **Mobile TBDR** rendering engine to **Minecraft 1.20.1 (Fabric)** and **[Aetherium](https://github.com/entitybrian69-bit/aetherium)** — with **zero Sodium dependency**.

          ### Downloads
          - **`agris-fabric-1.0.0+mc1.20.1.jar`** — Drop directly into `.minecraft/mods/` on **Fabric 1.20.1** (Java 17+, Fabric Loader `>=0.14.24`). Works alongside **Aetherium `1.20.1`** or standalone on Desktop & Android launchers (**PojavLauncher**, **Zalith**, **Fold Craft**, **Amethyst**, **MojoLauncher**).
          - **`Agris-Pocket-Ultra-Mobile.zip`** — Standalone archive of Agris's flagship zero-spill mobile shader pack (also built directly into the mod jar as `(agris-mobile)`).
          - **`agris-fabric-1.0.0+mc1.20.1-sources.jar`** — Full Java 17 source archive.
          - **`SHA256SUMS.txt`** — SHA-256 checksums for all release artifacts.

          ### Highlights
          - **Built for Aetherium on Fabric 1.20.1**: Declares `"provides": ["iris"]` + `IrisApi` v0.2 so Aetherium stays 100% `ACTIVE`, injects a native **14-row `Shaders` tab** into `AetheriumScreen`, guards `SectionCull` during shadow passes, and defers/restores Aetherium's `ColorFilter`.
          - **Mobile TBDR Optimizations**:
            - Auto-detects **Qualcomm Adreno GMEM**, **ARM Mali / Immortalis Tile Buffers**, **PowerVR**, **Samsung Xclipse**, **Apple Silicon TBDR**, and Android GL translators (`GL4ES`, `MobileGlues`, `GLES 3.0`, `Zink`, `LTW`).
            - Zero-allocation EMA **Dynamic FPS Resolution Governor** (smooth 5% steps with 1.5 s cooldown).
            - **World-Locked Shadow Interleaving** (`1/2` and `1/3` cadence with camera-relative matrix latching — zero shadow swimming).
            - Static `PackSamplerUsage` buffer stripping, `R11F_G11F_B10F` 50% HDR bandwidth compaction, `glBlitFramebuffer` depth copy, `glInvalidateFramebuffer` tile discard, zero-stall CPU `centerDepthSmooth`, and touchscreen drag/slider UI.
          - **4 Built-In Shader Packs**: `(agris-mobile)` *Agris Pocket Ultra*, `(agris-aetherial)` *Agris Aetherial*, `(agris-lite)` *Agris Complementary Lite*, and `(internal)`, plus full external `.zip`/folder shaderpack support in `shaderpacks/`.
          NOTES
          sed -i 's/^          //' release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "Agris $TAG (Fabric $MC_VER)" --notes-file release-notes.md
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Agris $TAG (Fabric $MC_VER)" \
              --notes-file release-notes.md \
              release-dist/*
          fi
